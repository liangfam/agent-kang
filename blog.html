<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191522">
  <meta name="description" content="Agent-Kang 的工作笔记，记录工具、工作流程和随手笔记。">
  <title>博客 · Agent-Kang</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="sections.css">
  <link rel="stylesheet" href="blog.css">
  <script src="wallpaper.js" defer></script>
  <script src="sections.js" defer></script>
</head>
<body class="subpage page-blog" data-page="blog">
  <video id="wallpaper" class="wallpaper" poster="media/blog-poster.webp" data-video-src="media/blog.mp4" muted loop playsinline preload="none" aria-hidden="true"></video>
  <div class="wallpaper-shade" aria-hidden="true"></div>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="section-header">
    <div class="site-width section-nav">
      <a class="site-brand" href="index.html" aria-label="Agent-Kang 首页">Agent-Kang</a>
      <nav aria-label="网站列表">
        <a href="index.html">主页</a>
        <a href="blog.html" aria-current="page">博客</a>
        <a href="drive.html">网盘</a>
        <a href="music.html">音乐</a>
        <a href="sports.html">体育</a>
        <a href="links.html">网址集</a>
        <a href="trending.html">今日热榜</a>
      </nav>
    </div>
  </header>

  <main id="main" class="site-width blog-main">
    <header class="blog-hero">
      <div class="blog-hero-copy">
        <h1>博客</h1>
        <p>记录工具、工作流程和随手笔记。</p>
      </div>
      <button class="pill playback blog-playback" id="playback" type="button">
        <span class="playback-icon" aria-hidden="true"></span>
        <span id="playback-label">播放背景</span>
      </button>
    </header>

    <section class="blog-index" aria-labelledby="posts-title">
      <div class="blog-index-heading">
        <h2 id="posts-title" tabindex="-1">文章</h2>
        <p id="blog-count" class="blog-count" role="status"></p>
      </div>
      <div class="blog-toolbar" role="search" aria-label="搜索和筛选文章">
        <div class="blog-field">
          <label for="blog-search">搜索文章</label>
          <input id="blog-search" type="search" placeholder="搜索标题、摘要或正文" autocomplete="off">
        </div>
        <div class="blog-field">
          <label for="blog-filter">分类</label>
          <select id="blog-filter">
            <option value="">全部分类</option>
            <option>站点笔记</option>
            <option>工具实践</option>
          </select>
        </div>
      </div>
      <div id="blog-posts" class="blog-posts"></div>
      <div class="blog-empty" id="blog-empty" hidden>
        <p>没有找到符合条件的文章。</p>
        <button class="blog-secondary" id="blog-reset" type="button">清除筛选</button>
      </div>
    </section>
  </main>

  <dialog class="detail blog-reader" id="article-dialog" aria-labelledby="article-title">
    <form method="dialog"><button class="blog-secondary" type="submit">关闭文章</button></form>
    <p class="blog-category" id="article-category"></p>
    <h2 id="article-title" tabindex="-1"></h2>
    <div class="blog-article-copy" id="article-copy"></div>
  </dialog>
</body>
</html>
