<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17242d">
  <title>网址集 · Agent-Kang</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="sections.css">
  <script src="wallpaper.js" defer></script>
  <script src="links-data.js" defer></script>
  <script src="sections.js?v=20261124" defer></script>
</head>
<body class="subpage page-links" data-page="links">
  <video id="wallpaper" class="wallpaper" poster="media/links-poster.webp" data-video-src="media/links.mp4" muted loop playsinline preload="none" aria-hidden="true"></video>
  <div class="wallpaper-shade" aria-hidden="true"></div>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="section-header">
    <div class="site-width section-nav">
      <a class="site-brand" href="index.html" aria-label="Agent-Kang 首页">Agent-Kang</a>
      <nav aria-label="网站列表">
        <a href="index.html">主页</a>
        <a href="blog.html">博客</a>
        <a href="drive.html">网盘</a>
        <a href="music.html">音乐</a>
        <a href="sports.html">体育</a>
        <a href="links.html" aria-current="page">网址集</a>
        <a href="trending.html">今日热榜</a>
      </nav>
    </div>
  </header>

  <main id="main" class="site-width page-main">
    <header class="page-intro">
      <h1>网址集</h1>
      <p>把常用网站放在同一页，点一下就能打开。</p>
    </header>
    <div class="page-content">
      <section class="glass panel catalog-panel" aria-labelledby="links-title" data-catalog="links">
        <div class="panel-heading">
          <h2 id="links-title">收藏导航</h2>
          <button type="button" class="action" id="links-add">添加网址</button>
        </div>
        <div class="filters"><label class="visually-hidden" for="links-search">搜索网址</label>
          <input id="links-search" type="search" placeholder="搜索网址">
          <label class="visually-hidden" for="links-filter">筛选分类</label>
          <select id="links-filter">
            <option value="">全部分类</option>
            <option>AI 工具</option>
            <option>学习办公</option>
            <option>设计素材</option>
            <option>体育分析</option>
            <option>网络工具</option>
            <option>自动化</option>
            <option>开发</option>
            <option>影音</option>
            <option>资讯</option>
            <option>其他</option>
          </select>
        </div>
        <div class="bookmark-grid" id="links-items" aria-live="polite"></div>
        <p class="helper" id="links-status" role="status"></p>
      </section>
      <dialog class="detail editor" id="links-form-dialog" aria-labelledby="links-form-title">
        <form id="links-form">
          <h2 id="links-form-title">添加网址</h2>
          <label>名称<input name="title" type="text" required maxlength="80" autofocus></label>
          <label>网站地址<input name="url" type="url" placeholder="https://" required maxlength="1000"></label>
          <label>分类
            <select name="category">
              <option>开发</option>
              <option>AI 工具</option>
              <option>学习办公</option>
              <option>设计素材</option>
              <option>体育分析</option>
              <option>网络工具</option>
              <option>自动化</option>
              <option>影音</option>
              <option>资讯</option>
              <option>其他</option>
            </select>
          </label>
          <p id="links-form-error" class="helper" role="alert"></p>
          <div class="form-actions">
            <button class="pill" type="button" id="links-cancel">取消</button>
            <button class="action" type="submit">保存网址</button>
          </div>
        </form>
      </dialog>
    </div>
  </main>

  <footer class="site-width controls"><button class="pill playback" id="playback" type="button">
      <span class="playback-icon" aria-hidden="true"></span>
      <span id="playback-label">播放背景</span>
    </button></footer>
</body>
</html>
